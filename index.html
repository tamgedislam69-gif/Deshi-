    <!-- App-like Zoom Lockdown & Gesture Lock Script -->
    <script>
      // Disable iOS Pinch Zoom & Gesture Zoom
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      }, { passive: false });

      // Disable Multi-touch Pinch Zoom
      document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Double-tap to Zoom
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Hind_Siliguri',_'Plus_Jakarta_Sans',_sans-serif] antialiased selection:bg-amber-500 selection:text-white overscroll-none touch-manipulation">

    <script type="module" src="/src/main.tsx"></script>
  </body>
